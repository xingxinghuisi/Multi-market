<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Market Radar</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <main class="container">

        <!-- =========================================
             Header
        ========================================== -->

        <header class="page-header">

            <div>

                <h1>
                    Market Radar
                </h1>

                <p>
                    Multi-Market Realtime Monitor
                </p>

            </div>

            <div
                id="connection-status"
                class="connection-offline"
            >
                ○ 正在连接
            </div>

        </header>


        <!-- =========================================
             添加资产
        ========================================== -->

        <section class="asset-manager">

            <h2>
                添加资产
            </h2>

            <form id="asset-form">

                <select
                    id="asset-market"
                    required
                >

                    <option value="US">
                        美股
                    </option>

                    <option value="HK">
                        港股
                    </option>

                    <option value="CRYPTO">
                        Crypto
                    </option>

                </select>


                <input
                    id="asset-symbol"
                    type="text"
                    placeholder="代码，例如 NVDA / 1810 / DOGEUSDT"
                    autocomplete="off"
                    required
                >


                <input
                    id="asset-name"
                    type="text"
                    placeholder="名称，可选"
                    autocomplete="off"
                >


                <button type="submit">
                    添加资产
                </button>

            </form>


            <div id="asset-form-message"></div>

        </section>


        <!-- =========================================
             Crypto
        ========================================== -->

        <section class="market-section">

            <div class="section-header">

                <h2>
                    Crypto
                </h2>

                <span>
                    Binance
                </span>

            </div>

            <div
                id="crypto-list"
                class="market-grid"
            ></div>

        </section>


        <!-- =========================================
             US Stocks
        ========================================== -->

        <section class="market-section">

            <div class="section-header">

                <h2>
                    US Stocks
                </h2>

                <span>
                    Moomoo
                </span>

            </div>

            <div
                id="us-list"
                class="market-grid"
            ></div>

        </section>


        <!-- =========================================
             Hong Kong Stocks
        ========================================== -->

        <section class="market-section">

            <div class="section-header">

                <h2>
                    Hong Kong Stocks
                </h2>

                <span>
                    Moomoo
                </span>

            </div>

            <div
                id="hk-list"
                class="market-grid"
            ></div>

        </section>


        <!-- =========================================
             Korea
        ========================================== -->

        <section class="market-section">

            <div class="section-header">

                <h2>
                    Korea
                </h2>

                <span>
                    Korea Market
                </span>

            </div>

            <div
                id="krx-list"
                class="market-grid"
            ></div>

        </section>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
